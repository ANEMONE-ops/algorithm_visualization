<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法可视化系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0c0c3a 0%, #1a1a5e 25%, #16213e 50%, #0f3460 75%, #1a1a2e 100%);
            z-index: -2;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .particle {
            position: absolute; background: white; border-radius: 50%;
            animation: floatUp linear infinite; opacity: 0;
        }
        @keyframes floatUp {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        .login-container {
            background: rgba(255,255,255,0.97); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 42px 40px 36px; width: 420px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
        }
        .login-header h1 {
            font-size: 26px; background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-header">
            <h1>🔬 算法过程可视化系统</h1>
            <p>交互式算法学习平台</p>
        </div>

        <div class="login-tabs">
            <button class="tab-btn active" data-tab="login">登录</button>
            <button class="tab-btn" data-tab="register">注册</button>
        </div>

        <div class="login-form" id="loginForm">
            <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username"></div>
            <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password"></div>
            <div class="form-error" id="loginError"></div>
            <button class="btn btn-primary btn-full" id="loginBtn">登 录</button>
        </div>

        <div class="login-form hidden" id="registerForm">
            <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="3-50个字符" autocomplete="username"></div>
            <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="至少6个字符" autocomplete="new-password"></div>
            <div class="form-group"><label>确认密码</label><input type="password" id="regPasswordConfirm" placeholder="再次输入密码" autocomplete="new-password"></div>
            <div class="form-error" id="regError"></div>
            <button class="btn btn-primary btn-full" id="registerBtn">注 册</button>
        </div>

        <div class="login-footer"><p>冒泡排序 | 最小生成树 | 哈夫曼树 | 汉诺塔 | 图着色 | 算法对比 | AI问答</p></div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
